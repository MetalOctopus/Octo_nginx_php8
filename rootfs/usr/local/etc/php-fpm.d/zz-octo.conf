[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = @USER@
group = @GROUP@
listen = /run/php-fpm.sock
listen.owner = @USER@
listen.group = @GROUP@
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
