name: build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'unraid/**']
  schedule:
    - cron: '17 19 * * 0'   # weekly: picks up new PHP / Alpine / nginx security releases
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/metaloctopus/octo_nginx_php8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (fresh layers + latest base image)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: true
          tags: octo:test

      - name: Smoke test
        run: |
          mkdir -p site
          echo '<?php echo "php-".PHP_MAJOR_VERSION; ' > site/index.php
          echo secret > site/.env
          docker run -d --name octotest -p 8080:80 -p 8443:443 -v "$PWD/site:/var/www/html" -v "$PWD/cfg:/config" octo:test
          for i in $(seq 30); do curl -fs localhost:8080/.octo-health >/dev/null 2>&1 && break; sleep 1; done
          docker logs octotest
          echo "health: $(docker inspect -f '{{.State.Health.Status}}' octotest)"
          ok() { if eval "$2"; then echo "PASS $1"; else echo "FAIL $1"; FAIL=1; fi; }
          FAIL=0
          ok http-php '[ "$(curl -s localhost:8080/index.php)" = "php-8" ]'
          ok https-php '[ "$(curl -sk https://localhost:8443/index.php)" = "php-8" ]'
          ok dotfile-blocked '[ "$(curl -s -o /dev/null -w %{http_code} localhost:8080/.env)" = 403 ]'
          ok no-version-banner 'curl -sI localhost:8080/ | grep -qi "^server: nginx.$"'
          ok healthcheck-cmd 'docker exec octotest sh -c "curl -fsS http://127.0.0.1/.octo-health && pgrep php-fpm"'
          curl -sI localhost:8080/ || true
          [ "$FAIL" = 0 ]
          docker exec octotest php -r 'echo PHP_VERSION, PHP_EOL;'
          docker exec octotest sh -c 'ps -o user,comm | grep -E "nginx|php-fpm"'

      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: octo:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Work out tags
        id: v
        run: |
          PHPV=$(docker run --rm --entrypoint php octo:test -r 'echo PHP_VERSION;')
          echo "tags=$IMAGE:latest,$IMAGE:php$PHPV,$IMAGE:$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.v.outputs.tags }}
